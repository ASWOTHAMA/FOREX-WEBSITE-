<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Aurum Forex Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-logo">
      <svg width="26" height="26" viewBox="0 0 30 30" fill="none">
        <path d="M15 2L27 9V21L15 28L3 21V9L15 2Z" stroke="#c9a227" stroke-width="1.2"/>
        <path d="M15 9L21 13V19L15 23L9 19V13L15 9Z" fill="#c9a227" opacity="0.85"/>
      </svg>
      Aurum
    </a>
    <div class="auth-title">Create your account</div>
    <div class="auth-sub">Register to reserve your seat in the next cohort.</div>

    <div class="auth-msg" id="registerMsg"></div>
    <div class="field"><label>Full name</label><input type="text" id="regName" autocomplete="name"></div>
    <div class="field-grid2">
      <div class="field"><label>Email</label><input type="email" id="regEmail" autocomplete="email"></div>
      <div class="field"><label>Phone number</label><input type="tel" id="regPhone" autocomplete="tel"></div>
    </div>
    <div class="field">
      <label>Country</label>
      <select id="regCountry">
        <option value="India">India</option>
        <option value="United States">United States</option>
        <option value="United Kingdom">United Kingdom</option>
        <option value="United Arab Emirates">United Arab Emirates</option>
        <option value="Singapore">Singapore</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field-grid2">
      <div class="field"><label>Password</label><input type="password" id="regPassword" autocomplete="new-password"></div>
      <div class="field"><label>Confirm password</label><input type="password" id="regConfirm" autocomplete="new-password"></div>
    </div>
    <button class="btn btn-gold auth-submit" id="registerSubmit">Create Account</button>
    <div class="auth-foot">Already registered? <a href="login.html" class="link-btn" style="text-decoration:none;">Log in</a></div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Aurum Forex Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-logo">
      <svg width="26" height="26" viewBox="0 0 30 30" fill="none">
        <path d="M15 2L27 9V21L15 28L3 21V9L15 2Z" stroke="#c9a227" stroke-width="1.2"/>
        <path d="M15 9L21 13V19L15 23L9 19V13L15 9Z" fill="#c9a227" opacity="0.85"/>
      </svg>
      Aurum
    </a>
    <div class="auth-title">Reset your password</div>
    <div class="auth-sub">Enter your account email and we'll send you a reset link.</div>

    <div class="auth-msg" id="forgotMsg"></div>
    <div class="field"><label>Email</label><input type="email" id="forgotEmail" autocomplete="email"></div>
    <button class="btn btn-gold auth-submit" id="forgotSubmit">Send Reset Email</button>
    <div class="auth-foot"><a href="login.html" class="link-btn" style="text-decoration:none;">Back to log in</a></div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>

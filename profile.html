<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Aurum Forex Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>
  .profile-grid{display:grid; grid-template-columns:220px 1fr; gap:32px;}
  @media(max-width:760px){.profile-grid{grid-template-columns:1fr;}}
  .avatar-box{text-align:center;}
  .avatar-circle{
    width:140px; height:140px; border-radius:50%; margin:0 auto 16px; overflow:hidden;
    border:1px solid var(--hair-strong); background:linear-gradient(135deg,var(--gold),#5a4a12);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:44px; color:#100c02;
  }
  .avatar-circle img{width:100%; height:100%; object-fit:cover;}
  .panel + .panel{margin-top:24px;}
</style>
</head>
<body>

<div class="page-loader" id="pageLoader"><div class="spinner"></div></div>

<div class="dash">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg width="24" height="24" viewBox="0 0 30 30" fill="none">
        <path d="M15 2L27 9V21L15 28L3 21V9L15 2Z" stroke="#c9a227" stroke-width="1.2"/>
        <path d="M15 9L21 13V19L15 23L9 19V13L15 9Z" fill="#c9a227" opacity="0.85"/>
      </svg>
      Aurum
    </div>
    <div class="side-group">
      <div class="side-label">Overview</div>
      <a href="dashboard.html" class="side-link"><span class="dot"></span>Dashboard</a>
      <div class="side-link active"><span class="dot"></span>Profile</div>
    </div>
    <div class="side-group" style="margin-top:auto;">
      <div class="side-label">Account</div>
      <a href="#" id="logoutBtn" class="side-link" style="color:var(--down);"><span class="dot"></span>Logout</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div class="menu-toggle" id="menuToggle">☰</div>
      <div class="dash-welcome">
        <h1>Your profile</h1>
        <p>Update your details or change your password.</p>
      </div>
      <div></div>
    </div>

    <div class="profile-grid">
      <div class="avatar-box">
        <div class="avatar-circle" id="avatarCircle">A</div>
        <input type="file" id="photoInput" accept="image/*" style="font-size:12px; color:var(--muted-2);">
        <div style="font-size:11px; color:var(--muted-2); margin-top:8px;">JPG or PNG, under 2MB</div>
      </div>

      <div>
        <div class="panel">
          <h3>Personal details</h3>
          <div class="auth-msg" id="profileMsg"></div>
          <div class="field"><label>Full name</label><input type="text" id="pName"></div>
          <div class="field-grid2" style="display:grid; grid-template-columns:1fr 1fr; gap:0 14px;">
            <div class="field"><label>Phone</label><input type="tel" id="pPhone"></div>
            <div class="field">
              <label>Country</label>
              <select id="pCountry">
                <option>India</option><option>United States</option><option>United Kingdom</option>
                <option>United Arab Emirates</option><option>Singapore</option><option>Other</option>
              </select>
            </div>
          </div>
          <div class="field"><label>Bio</label><textarea id="pBio" placeholder="A short line about you and your trading goals."></textarea></div>
          <button class="btn btn-gold" id="saveProfileBtn">Save Changes</button>
        </div>

        <div class="panel">
          <h3>Change password</h3>
          <div class="auth-msg" id="passwordMsg"></div>
          <div class="field"><label>Current password</label><input type="password" id="curPassword" autocomplete="current-password"></div>
          <div class="field-grid2" style="display:grid; grid-template-columns:1fr 1fr; gap:0 14px;">
            <div class="field"><label>New password</label><input type="password" id="newPassword" autocomplete="new-password"></div>
            <div class="field"><label>Confirm new password</label><input type="password" id="newPasswordConfirm" autocomplete="new-password"></div>
          </div>
          <button class="btn btn-ghost" id="changePasswordBtn">Update Password</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-stack" id="toastStack"></div>

<script type="module" src="js/profile.js"></script>
<script>
  document.getElementById('menuToggle')?.addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Aurum Forex Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="page-loader" id="pageLoader"><div class="spinner"></div></div>

<div class="dash">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg width="24" height="24" viewBox="0 0 30 30" fill="none">
        <path d="M15 2L27 9V21L15 28L3 21V9L15 2Z" stroke="#c9a227" stroke-width="1.2"/>
        <path d="M15 9L21 13V19L15 23L9 19V13L15 9Z" fill="#c9a227" opacity="0.85"/>
      </svg>
      Aurum <span class="badge warn" style="margin-left:4px;">Admin</span>
    </div>
    <div class="side-group">
      <div class="side-label">Overview</div>
      <div class="side-link active"><span class="dot"></span>Analytics</div>
    </div>
    <div class="side-group">
      <div class="side-label">Manage</div>
      <a href="students.html" class="side-link"><span class="dot"></span>Students</a>
      <a href="courses.html" class="side-link"><span class="dot"></span>Courses</a>
      <a href="videos.html" class="side-link"><span class="dot"></span>Videos</a>
      <a href="notes.html" class="side-link"><span class="dot"></span>PDF Notes</a>
      <a href="certificates.html" class="side-link"><span class="dot"></span>Certificates</a>
      <a href="announcements.html" class="side-link"><span class="dot"></span>Announcements</a>
      <a href="payments.html" class="side-link"><span class="dot"></span>Payments</a>
    </div>
    <div class="side-group" style="margin-top:auto;">
      <div class="side-label">Account</div>
      <a href="dashboard.html" class="side-link"><span class="dot"></span>Student view</a>
      <a href="#" id="logoutBtn" class="side-link" style="color:var(--down);"><span class="dot"></span>Logout</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div class="menu-toggle" id="menuToggle">☰</div>
      <div class="dash-welcome">
        <h1 id="adminWelcome">Admin Dashboard</h1>
        <p>Live figures from Firestore.</p>
      </div>
      <div></div>
    </div>

    <div class="stat-grid" style="grid-template-columns:repeat(5,1fr);">
      <div class="stat-cell"><div class="lbl">Total Students</div><div class="val" id="statTotalStudents">—</div></div>
      <div class="stat-cell"><div class="lbl">Active</div><div class="val" id="statActiveStudents">—</div></div>
      <div class="stat-cell"><div class="lbl">Suspended</div><div class="val" id="statSuspended">—</div></div>
      <div class="stat-cell"><div class="lbl">Revenue</div><div class="val" id="statRevenue">—</div></div>
      <div class="stat-cell"><div class="lbl">Course Lessons</div><div class="val" id="statCourseLessons">—</div></div>
    </div>

    <div class="panel">
      <h3>Recent announcements</h3>
      <div id="announcementFeed"><p class="placeholder-note">Loading…</p></div>
    </div>
  </main>
</div>

<div class="toast-stack" id="toastStack"></div>

<script type="module" src="js/admin.js"></script>
<script>
  document.getElementById('menuToggle')?.addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
  });
</script>
</body>
</html>

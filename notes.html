<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Notes — Admin — Aurum Forex Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="page-loader" id="pageLoader"><div class="spinner"></div></div>

<div class="dash">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">Aurum <span class="badge warn" style="margin-left:4px;">Admin</span></div>
    <div class="side-group"><div class="side-label">Overview</div><a href="admin.html" class="side-link"><span class="dot"></span>Analytics</a></div>
    <div class="side-group">
      <div class="side-label">Manage</div>
      <a href="students.html" class="side-link"><span class="dot"></span>Students</a>
      <a href="courses.html" class="side-link"><span class="dot"></span>Courses</a>
      <a href="videos.html" class="side-link"><span class="dot"></span>Videos</a>
      <div class="side-link active"><span class="dot"></span>PDF Notes</div>
      <a href="certificates.html" class="side-link"><span class="dot"></span>Certificates</a>
      <a href="announcements.html" class="side-link"><span class="dot"></span>Announcements</a>
      <a href="payments.html" class="side-link"><span class="dot"></span>Payments</a>
    </div>
    <div class="side-group" style="margin-top:auto;">
      <a href="dashboard.html" class="side-link"><span class="dot"></span>Student view</a>
      <a href="#" id="logoutBtn" class="side-link" style="color:var(--down);"><span class="dot"></span>Logout</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div class="menu-toggle" id="menuToggle">☰</div>
      <div class="dash-welcome"><h1>PDF Notes</h1><p>Upload reference notes to Firebase Storage.</p></div>
      <div></div>
    </div>

    <div class="panel" style="margin-bottom:24px;">
      <h3>Upload a PDF</h3>
      <div class="auth-msg" id="noteMsg"></div>
      <div class="field"><label>Title</label><input type="text" id="nTitle" placeholder="e.g. Week 3 · SMC Cheat Sheet"></div>
      <div class="field"><label>Week</label><input type="number" id="nWeek" min="1" value="1"></div>
      <label class="upload-drop" for="noteFile">
        <div id="noteDropText">Click to choose a PDF file</div>
        <input type="file" id="noteFile" accept="application/pdf">
      </label>
      <div class="upload-progress" id="noteProgressWrap"><div class="upload-progress-fill" id="noteProgressFill"></div></div>
      <button class="btn btn-gold" id="uploadNoteBtn">Upload PDF</button>
    </div>

    <div class="panel">
      <h3>Uploaded notes</h3>
      <div id="noteList"><p class="placeholder-note">Loading…</p></div>
    </div>
  </main>
</div>

<div class="toast-stack" id="toastStack"></div>

<script type="module" src="js/notes.js"></script>
<script>
  document.getElementById('menuToggle')?.addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
  });
</script>
</body>
</html>

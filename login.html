<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Aurum Forex Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="page-loader" id="pageLoader" style="display:none;"><div class="spinner"></div></div>

<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-logo">
      <svg width="26" height="26" viewBox="0 0 30 30" fill="none">
        <path d="M15 2L27 9V21L15 28L3 21V9L15 2Z" stroke="#c9a227" stroke-width="1.2"/>
        <path d="M15 9L21 13V19L15 23L9 19V13L15 9Z" fill="#c9a227" opacity="0.85"/>
      </svg>
      Aurum
    </a>
    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Log in to access your dashboard.</div>

    <div class="auth-msg" id="loginMsg"></div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" autocomplete="email"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
    <div class="field-row">
      <label class="remember"><input type="checkbox" id="loginRemember" checked> Remember me</label>
      <a href="forgot-password.html" class="link-btn" style="text-decoration:none;">Forgot password?</a>
    </div>
    <button class="btn btn-gold auth-submit" id="loginSubmit">Log In</button>
    <div class="auth-foot">New here? <a href="register.html" class="link-btn" style="text-decoration:none;">Create an account</a></div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
